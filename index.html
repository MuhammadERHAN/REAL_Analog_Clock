<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making Analog Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
</head>
<body class="min-h-[100vh] flex justify-center items-center bg-cover bg-center"     
style="background-image: url('https://images.unsplash.com/photo-1503264116251-35a269479413');">


  <!-- Overlay for clarity -->
  <div class="flex flex-col items-center gap-8 p-8 bg-black/40 backdrop-blur-md rounded-xl">

    <!-- for heading -->
    <div class="flex flex-col items-center gap-12 text-[#fff] font-[Poppins] ">
        <h1 class="text-center">
            <span class="animate-pulse text-3xl drop-shadow-[0_0_15px_rgba(0,255,255,0.7)] md:text-3xl lg:text-4xl
            bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 
            tracking-wide font-bold cursor-default select-none transition-all duration-300 hover:scale-110 hover:from-blue-500 hover:to-cyan-500">My Analog Clock
           </span>
        </h1>

        <!-- Clock Container -->
        <div class="relative text-white w-[320px] h-[320px] rounded-full 
        bg-[rgba(255,255,255,0.05)] flex justify-center items-center border
        border-[rgba(255,255,255,0.2)] shadow-[0_0_50px_rgba(0,255,255,0.5)]">

        <!-- Center Dot -->
        <div class="before:content-[''] before:shadow-[0_0_20px_#0ff] before:left-1/2 before:top-1/2 
        before:-translate-x-1/2 before:-translate-y-1/2 before:z-30 before:rounded-full 
        before:absolute before:w-[9px] before:h-[9px] before:bg-[#fff] 
        [&>span]:absolute [&>span]:transform-[rotate(calc(var(--a)*30deg))] [&>span]:text-center [&>span]:inset-[12px] 
        [&>span>b]:inline-block [&>span>b]:transform-[rotate(calc(-30deg*var(--a)))] [&>span>b]:text-[20px]">

        <!-- /*Making clock hands*/ -->
          <div class="z-10 absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 [&>i]:rounded 
           flex justify-center items-end [&>i]:absolute [&>i]:bg-[var(--clr)] [&>i]:origin-bottom  ">
          <!-- Hour Hand -->
          <i style="--clr:#ff3d58; height:60px ; "  
           id="hour" class="z-10 w-[5px] shadow-[0_0_15px_#ff3d58] origin-bottom rounded"></i>
           <!-- Minute Hand -->
           <i style="--clr:#00a6ff; height:85px ;" 
            id="min" class="z-20 w-[4px] shadow-[0_0_15px_#00a6ff] origin-bottom rounded"></i>
            <!-- Second Hand -->
           <i style="--clr:#ffffff; height:100px ;" 
           id="sec" class="z-30 w-[2px] shadow-[0_0_12px_#fff] origin-bottom rounded"></i>
           </div>

            <!-- Clock Numbers -->
            <span style="--a:1"><b>1</b></span>
            <span style="--a:2"><b>2</b></span>
            <span style="--a:3"><b>3</b></span>
            <span style="--a:4"><b>4</b></span>
            <span style="--a:5"><b>5</b></span>
            <span style="--a:6"><b>6</b></span>
            <span style="--a:7"><b>7</b></span>
            <span style="--a:8"><b>8</b></span>
            <span style="--a:9"><b>9</b></span>
            <span style="--a:10"><b>10</b></span>
            <span style="--a:11"><b>11</b></span>
            <span style="--a:12"><b>12</b></span>
        
        </div>
            

        </div>
        </div> <!--yahan pr heading bnd hui-->        
    <script src="clock.js"></script>
    
</body>
</html>
